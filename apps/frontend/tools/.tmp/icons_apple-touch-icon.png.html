<!doctype html><html><head><style>
    html,body{margin:0;padding:0;background:transparent;overflow:hidden}
    svg{display:block;width:180px;height:180px}
  </style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mizan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D3328"/>
      <stop offset="0.55" stop-color="#071C16"/>
      <stop offset="1" stop-color="#030B09"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0.22" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#2EE6A6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2EE6A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#4FD8FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4FD8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1FD69A"/>
      <stop offset="0.6" stop-color="#5EF0C4"/>
      <stop offset="1" stop-color="#7FE4FF"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softblur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="squircle"><rect width="512" height="512" rx="118"/></clipPath>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#glowTL)"/>
  <rect width="512" height="512" rx="118" fill="url(#glowBR)"/>

  <!-- fine perspective grid: the "floor" -->
  <g clip-path="url(#squircle)" stroke="#5EF0C4" stroke-opacity="0.10" stroke-width="2" fill="none">
    <path d="M-40 512 L200 300 M80 512 L228 300 M200 512 L256 300 M312 512 L284 300 M432 512 L312 300 M552 512 L340 300"/>
    <path d="M0 340 H512 M0 392 H512 M0 456 H512" stroke-opacity="0.07"/>
  </g>

  <!-- neon glow halo of the mark -->
  <g filter="url(#blur)" opacity="0.65" fill="none" stroke="url(#neon)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M122 372 V178 L256 312 L390 178 V372"/>
  </g>

  <!-- balance beam -->
  <path d="M92 150 H420" stroke="#E9FFF7" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round" filter="url(#softblur)"/>
  <path d="M92 150 H420" stroke="#F4FFFB" stroke-width="10" stroke-linecap="round"/>
  <!-- pan hangers from beam to the M peaks -->
  <path d="M122 150 V178 M390 150 V178" stroke="#F4FFFB" stroke-opacity="0.8" stroke-width="10" stroke-linecap="round"/>

  <!-- the M -->
  <path d="M122 372 V178 L256 312 L390 178 V372" fill="none" stroke="url(#neon)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pivot node at the vertex -->
  <circle cx="256" cy="312" r="34" fill="#5EF0C4" opacity="0.35" filter="url(#softblur)"/>
  <circle cx="256" cy="312" r="24" fill="#061812" stroke="#F4FFFB" stroke-width="9"/>
  <circle cx="256" cy="312" r="7" fill="#F4FFFB"/>

  <!-- specular rim -->
  <rect x="3" y="3" width="506" height="506" rx="115" fill="none" stroke="url(#rim)" stroke-width="6"/>
</svg>
</body></html>
